name: ZBuild Godot tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "tools/zbuild-godot.py"
      - "tools/test_zbuild_godot.py"
      - ".github/workflows/zbuild-godot.yml"

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile CLI
        run: python -m py_compile tools/zbuild-godot.py
      - name: Run unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
